name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Dependency Graph Availability
        id: depgraph
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const status =
              repo.data.security_and_analysis?.dependency_graph?.status ??
              'unknown';
            core.setOutput('enabled', status === 'enabled' ? 'true' : 'false');
            if (status !== 'enabled') {
              core.notice(
                `Dependency graph is ${status}; skipping dependency review for this run.`,
              );
            }

      - name: Dependency Review
        if: steps.depgraph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4

      - name: Dependency Review Skipped
        if: steps.depgraph.outputs.enabled != 'true'
        run: echo "Dependency graph unavailable; dependency review skipped."
