name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set SHAs for Nx Affected
        uses: nrwl/nx-set-shas@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start Nx Cloud CI Run
        if: ${{ secrets.NX_CLOUD_ACCESS_TOKEN != '' }}
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: npx nx-cloud start-ci-run

      - name: Install Dependencies
        run: npm ci

      - name: Workspace Policy Lint Gate
        run: npx nx run workspace-policy:lint

      - name: Workspace Module Boundary Gate
        run: npx nx run workspace-policy:module-boundary-check

      - name: Affected Lint Test Build
        run: npx nx affected -t lint test build --base=$NX_BASE --head=$NX_HEAD

      - name: Affected E2E On Main
        if: github.ref == 'refs/heads/main'
        run: npx nx affected -t e2e --base=$NX_BASE --head=$NX_HEAD

      - name: Fix CI
        if: always()
        run: npx nx fix-ci
