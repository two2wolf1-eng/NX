name: Acceptance

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Workspace Acceptance
        run: npx nx run workspace-policy:acceptance

      - name: Upload Acceptance Report
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: dist/reports/acceptance-report.md
          if-no-files-found: error

      - name: Upload Migration Bundles
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-migration-bundles
          path: dist/migrations/**
          if-no-files-found: error
